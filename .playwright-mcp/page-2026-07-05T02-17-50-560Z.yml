    - region "From a sentence to a shipped app, in three moves." [ref=e82]:
      - paragraph [ref=e83]: How it works
      - heading "From a sentence to a shipped app, in three moves." [level=2] [ref=e84]
      - paragraph [ref=e85]: The guided path does the heavy lifting — you stay in control at every gate.
      - generic [ref=e86]:
        - article [ref=e87]:
          - generic [ref=e88]: "01"
          - generic [ref=e89]: Describe
          - heading "Say what you want to build" [level=3] [ref=e90]
          - paragraph [ref=e91]: One prompt starts it. The guided intake asks a few visual questions — archetype, direction, the capabilities it needs — each with a "describe your own" escape hatch. Skip them all and just build if you already know.
        - article [ref=e92]:
          - generic [ref=e93]: "02"
          - generic [ref=e94]: Watch it build
          - heading "The Conductor authors your app live" [level=3] [ref=e95]
          - paragraph [ref=e96]: A single orchestrator composes your app as a real 3D knowledge graph, streaming each wave into the engine as it lands. You approve the Build Brief before a line is generated — nothing runs without your sign-off.
        - article [ref=e97]:
          - generic [ref=e98]: "03"
          - generic [ref=e99]: Ship it
          - heading "Verified, then live" [level=3] [ref=e100]
          - paragraph [ref=e101]: Every build is checked — it behaves, it looks right, it deploys — before it earns the word "shippable". Then it runs at a real URL, or exports as a portable bundle you own.
    - region "A real engine, not a template." [ref=e102]:
      - paragraph [ref=e103]: What you get
      - heading "A real engine, not a template." [level=2] [ref=e104]
      - paragraph [ref=e105]: Everything renders in one continuous 3D scene — the same engine that builds your app powers this page.
      - generic [ref=e106]:
        - article [ref=e107]:
          - img [ref=e110]
          - heading "One engine, one scene" [level=3] [ref=e113]
          - paragraph [ref=e114]: Your app is a single continuous 3D scene — galaxy, canvas, and live preview are states of it, not separate screens. Real WebGPU with an automatic WebGL2 fallback; no video, no mockups.
        - article [ref=e115]:
          - img [ref=e118]
          - heading "Edit by conversation" [level=3] [ref=e121]
          - paragraph [ref=e122]: Talk to the builder or drag a handle — both make the same scoped, additive change. Touch one node and its neighbours stay exactly as they were.
        - article [ref=e123]:
          - img [ref=e126]
          - heading "Connect virtually anything" [level=3] [ref=e129]
          - paragraph [ref=e130]: A curated one-click catalog for the head, and an agent that authors a new connector for the long tail. If it has an API, you can wire it — one click, one review, secrets never touch the browser.
        - article [ref=e131]:
          - img [ref=e134]
          - heading "Ship anywhere" [level=3] [ref=e137]
          - paragraph [ref=e138]: Deploy to Prism Cloud in a click, or bring your own host. Every project exports as a portable bundle — the graph, the assets, the manifest. You are never locked in.
        - article [ref=e139]:
          - img [ref=e142]
          - heading "Every version, reversible" [level=3] [ref=e145]
          - paragraph [ref=e146]: A visual timeline of your build. Save a checkpoint, restore one in a click, and re-verify it — nothing you make is ever a one-way door.
        - article [ref=e147]:
          - img [ref=e150]
          - heading "Yours alone" [level=3] [ref=e153]
          - paragraph [ref=e154]: "Hard per-tenant isolation: your projects, storage, and builds are never visible to another account. Bring a team on the enterprise tier when you want to build together."
