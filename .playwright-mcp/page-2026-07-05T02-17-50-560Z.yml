      - generic [ref=e241]:
        - generic [ref=e242]:
          - heading "Is the 3D real, or a video?" [level=3] [ref=e243]
          - paragraph [ref=e244]: Real. Every scene you see — the hero, your app, the preview — renders live in the browser on the same WebGPU engine that powers the product, with an automatic WebGL2 fallback for older devices.
        - generic [ref=e245]:
          - heading "Do I own what I build?" [level=3] [ref=e246]
          - paragraph [ref=e247]: Yes. Deploy to Prism Cloud in a click, or export a portable bundle — the graph, the assets, the manifest — and host it yourself. There is no lock-in.
        - generic [ref=e248]:
          - heading "Can I connect my existing tools?" [level=3] [ref=e249]
          - paragraph [ref=e250]: A curated catalog covers the popular integrations in one click, and when something is not on the list the agent authors a connector for it. If it has an API, you can wire it.
        - generic [ref=e251]:
          - heading "Is my work private?" [level=3] [ref=e252]
          - paragraph [ref=e253]: By default your account is fully isolated — your projects and builds are never visible to anyone else. Bring a team together on the enterprise tier when you want to.
